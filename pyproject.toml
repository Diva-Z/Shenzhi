[build-system]
requires = ["setuptools>=45.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shenzhi"
version = "1.0.0"
description = "ShenZhi - AI companion platform (multi-persona, multi-channel). Forked from CowAgent (MIT)."
requires-python = ">=3.7"
dependencies = [
    "click>=8.0",
    "requests>=2.28.2",
]

[project.scripts]
shenzhi = "cli.cli:main"

[tool.setuptools.packages.find]
include = ["cli*"]
