[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shenzhi"
# Single source of truth for the version is cli/VERSION (read at build time)
dynamic = ["version"]
description = "ShenZhi - AI companion platform (multi-persona, multi-channel). Forked from CowAgent (MIT)."
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "requests>=2.28.2",
]

[project.scripts]
shenzhi = "cli.cli:main"

[tool.setuptools.dynamic]
version = { file = "cli/VERSION" }

[tool.setuptools.packages.find]
include = [
    "agent*",
    "bridge*",
    "channel*",
    "cli*",
    "common*",
    "master*",
    "models*",
    "plugins*",
    "skills*",
    "translate*",
    "voice*",
]
